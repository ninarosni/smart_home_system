name: Build Apps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Native Config Files from Secrets (Base64)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
            echo "Using real Firebase config from secrets for Android"
          else
            echo '{"project_info":{"project_number":"0","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.example.smart_home_system"}},"api_key":[{"current_key":"dummy"}]}]}' > android/app/google-services.json
            echo "Using dummy Firebase config for Android"
          fi

      - name: Get Dependencies
        run: flutter pub get
        
      - name: Build APK
        run: flutter build apk --release
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Inject Secrets into Dart
        env:
          GOOGLE_SERVICES_JSON_RAW: ${{ secrets.GOOGLE_SERVICES_JSON }}
          IOS_SERVICES_PLIST_RAW: ${{ secrets.IOS_SERVICES_PLIST }}
        run: |
          cat << 'EOF' > inject_secrets.py
          import os, base64, json, plistlib
          def get_val(v): return f'"{v}"' if v else 'null'
          def try_decode(raw):
              if not raw: return None
              try: return base64.b64decode(raw).decode()
              except: return raw

          api_key = app_id = sender_id = project_id = db_url = bundle_id = None
          
          # Android (For fallback/aggresive auto-config)
          try:
              content = try_decode(os.environ.get('GOOGLE_SERVICES_JSON_RAW', ''))
              if content:
                  data = json.loads(content)
                  project_id = data['project_info']['project_id']
                  sender_id = data['project_info'].get('project_number')
                  db_url = data['project_info'].get('firebase_url')
                  client = data['client'][0]
                  api_key = client['api_key'][0]['current_key']
                  app_id = client['client_info']['mobilesdk_app_id']
          except: pass
          
          # iOS (The priority for this job)
          try:
              content = try_decode(os.environ.get('IOS_SERVICES_PLIST_RAW', ''))
              if content:
                  data = plistlib.loads(content.encode() if isinstance(content, str) else content)
                  api_key = data.get('API_KEY', api_key)
                  app_id = data.get('GOOGLE_APP_ID', app_id)
                  project_id = data.get('PROJECT_ID', project_id)
                  bundle_id = data.get('BUNDLE_ID')
          except: pass

          with open('lib/config/firebase_secrets.dart', 'w') as f:
              f.write('class FirebaseSecrets {\n')
              f.write(f'  static const String? apiKey = {get_val(api_key)};\n')
              f.write(f'  static const String? appId = {get_val(app_id)};\n')
              f.write(f'  static const String? messagingSenderId = {get_val(sender_id)};\n')
              f.write(f'  static const String? projectId = {get_val(project_id)};\n')
              f.write(f'  static const String? databaseURL = {get_val(db_url)};\n')
              f.write(f'  static const String? iosBundleId = {get_val(bundle_id)};\n')
              f.write('  static String get diagnosticInfo {\n')
              f.write('    return "API: ${apiKey != null ? \'OK\' : \'MISSING\'}, " \n')
              f.write('           "ID: ${appId != null ? \'OK\' : \'MISSING\'}, " \n')
              f.write('           "Project: ${projectId != null ? \'OK\' : \'MISSING\'}, " \n')
              f.write('           "Bundle: ${iosBundleId != null ? \'OK\' : \'MISSING\'}";\n')
              f.write('  }\n')
              f.write('}\n')
          EOF
          python3 inject_secrets.py

      - name: Create Native Config Files (Dummy)
        run: |
          mkdir -p ios/Runner
          echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>API_KEY</key><string>dummy</string><key>GOOGLE_APP_ID</key><string>1:0:ios:0</string><key>PROJECT_ID</key><string>dummy</string><key>BUNDLE_ID</key><string>com.example.smartHomeSystem</string></dict></plist>' > ios/Runner/GoogleService-Info.plist
          
      - name: Get Dependencies
        run: flutter pub get
        
      - name: Build iOS (No Sign)
        run: flutter build ios --release --no-codesign
        
      - name: Create IPA structure
        run: |
          mkdir -p build/ios/iphoneos/Payload
          mv build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r ../../smart_home.ipa Payload
          
      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: build/smart_home.ipa
